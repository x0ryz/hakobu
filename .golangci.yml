version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback # deferred after Commit, the error is expected
    staticcheck:
      checks:
        - all
        # golangci-lint defaults
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # error strings may start with a proper noun ("Cloudflare ...")
        - -ST1005
  exclusions:
    presets:
      - std-error-handling # Close, Fprint*, os.Remove*, os.Setenv
