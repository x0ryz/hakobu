version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries.sql
    gen:
      go:
        package: store
        out: internal/store
        output_models_file_name: models.gen.go
        output_db_file_name: db.gen.go
        output_files_suffix: .gen
        rename:
          app: AppRecord
          app_view: App
          github_app: GitHubApp
          db_user: User
          db_password: Password
          linked_db: LinkedDB
          trigger_source: Trigger
          github_login: GitHubLogin
          github_id: GitHubID
          memory_mb: MemoryMB
          snapshot_db: SnapshotDB
        # Secrets are encrypted in the database (internal/secret).
        overrides:
          - column: projects.shared_env
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: apps.env
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: apps.sentry_key
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: app_view.env
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: app_view.sentry_key
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: workers.env
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: databases.db_password
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: storages.secret_access_key
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: github_app.private_key
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: github_app.webhook_secret
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: github_app.client_secret
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: cloudflare.api_token
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: cloudflare.tunnel_token
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: sealed_vars.value
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: workers.command
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: deploy_logs.output
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: telemetry_events.message
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
          - column: telemetry_events.payload
            go_type: {import: github.com/x0ryz/hakobu/internal/secret, type: String}
