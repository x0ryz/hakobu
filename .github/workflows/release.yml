name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The signing key is a secret of this environment, which only v* tags
    # may deploy to.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAKOBU_SIGNING_KEY: ${{ secrets.HAKOBU_SIGNING_KEY }}
