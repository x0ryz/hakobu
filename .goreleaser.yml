version: 2

project_name: hakobu

before:
  hooks:
    - go mod tidy

builds:
  - id: hakobu
    main: .
    binary: hakobu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/x0ryz/hakobu/cmd.version={{ .Version }}

# Raw binaries, not tar/zip archives: install.sh downloads
# hakobu-<os>-<arch> directly by name, no unpacking step.
archives:
  - id: hakobu
    formats: [binary]
    name_template: "hakobu-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# checksums.txt.sig: what `hakobu update` and install.sh check before
# installing anything (scripts/sign-release.sh). Without the key the
# release fails rather than going out unsigned.
signs:
  - id: release
    artifacts: checksum
    signature: "${artifact}.sig"
    cmd: sh
    args: ["scripts/sign-release.sh", "{{ .Tag }}", "${artifact}", "${signature}"]

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - "^Merge pull request"
      - "^Merge branch"
  groups:
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Other changes"
      order: 999

release:
  name_template: "{{ .Tag }}"
